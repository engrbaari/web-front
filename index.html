<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creativity never ends — a creative event landing page.">
  <title>Creativity Never Ends</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="navbar">
      <a class="brand" href="#" aria-label="Creative home">
        <span class="brand-mark"><i></i><b>✦</b></span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Event</a>
        <a href="#">Contact</a>
      </nav>
      <a class="login" href="#">Loging</a>
    </header>

    <section class="hero">
      <div class="copy">
          <h1><span>Ramadan</span><br><em>Mohamed</em> <strong>OMar</strong></h1>
          <h1><span>reativity</span><br><em>never</em> <strong>ends</strong></h1>
        
        <a class="ticket" href="#">Tickets</a>
        <div class="socials" aria-label="Social links">
          <a href="#" aria-label="Twitter">♥</a>
          <a href="#" aria-label="Facebook">f</a>
          <a href="#" aria-label="Instagram">◎</a>
        </div>
      </div>

      <div class="art" aria-hidden="true">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="orbit orbit-three"></div>
        <div class="cloud">
          <span class="cloud-puff puff-a"></span>
          <span class="cloud-puff puff-b"></span>
          <span class="cloud-puff puff-c"></span>
          <span class="cloud-puff puff-d"></span>
          <span class="cloud-puff puff-e"></span>
        </div>
        <span class="planet planet-one"></span>
        <span class="planet planet-two"></span>
        <span class="planet planet-three"></span>
        <span class="spark spark-one">✦</span>
        <span class="spark spark-two">✧</span>
        <span class="spark spark-three">✦</span>
        <span class="paper-plane"></span>
        <span class="puzzle">✦</span>
        <div class="person">
          <div class="hair"></div>
          <div class="head"></div>
          <div class="neck"></div>
          <div class="body"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>
          <div class="dress"></div>
          <div class="skirt"></div>
        </div>
      </div>

      <aside class="event-date">
        <span>20</span>
        <span>November</span>
        <span>2026</span>
      </aside>
      <a class="plus" href="#" aria-label="More information">+</a>
    </section>
  </main>

</html>
